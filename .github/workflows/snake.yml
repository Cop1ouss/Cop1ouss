# Redraws the contribution snake every day and publishes it to the `output` branch,
# which the profile README links to. © 2026 Dajoni Gomez · Uncook™
name: contribution snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#8839ef&color_dots=#dce0e8,#cba6f7,#b384f2,#9d5ef1,#8839ef
            dist/snake-dark.svg?color_snake=#cba6f7&color_dots=#313244,#45475a,#7e6a9e,#a688cf,#cba6f7

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
