# When you log a milestone in docs/data/journey.json, this refreshes the
# "latest" list in README.md. The site in docs/ reads the same file directly.
# © 2026 Dajoni Gomez · Uncook™
name: sync journey

on:
  push:
    branches: [main]
    paths: ["docs/data/journey.json", "scripts/sync_readme.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/sync_readme.py
      - name: Commit if the README changed
        run: |
          if git diff --quiet README.md; then echo "README already up to date"; exit 0; fi
          git config user.name "uncook-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: sync journey log into README"
          git push
